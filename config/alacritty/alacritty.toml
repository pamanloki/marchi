# marchi :: alacritty
# Colors are imported from the active theme (generated by marchi-theme-set).
# Alacritty live-reloads when the imported file changes.

general.import = ["~/.local/state/marchi/current/theme/alacritty.toml"]

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[font]
size = 10.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

[window]
padding = { x = 14, y = 14 }
decorations = "None"
opacity = 1.0
dynamic_padding = true

[scrolling]
history = 10000

[keyboard]
bindings = [
  { key = "Insert", mods = "Shift", action = "Paste" },
  { key = "Insert", mods = "Control", action = "Copy" },
]
