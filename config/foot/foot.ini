# marchi :: foot
# Colors come from the active theme via the include below (generated by
# marchi-theme-set). foot live-reloads on SIGUSR1, which marchi-theme-set sends.

font=JetBrainsMono Nerd Font:size=10
pad=14x14
dpi-aware=yes

[scrollback]
lines=10000

[cursor]
style=beam

[mouse]
hide-when-typing=yes

# Theme colors (generated). Keep this include last so it wins.
include=~/.local/state/marchi/current/theme/foot.ini
